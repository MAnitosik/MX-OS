---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: MX-OS/MX-OS
description: Mr? Ms? Wrong! MX is the right choice!
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 45
platforms:
  - linux/amd64
modules:
  - type: script
    snippets:
      - "rm -v /usr/share/plymouth/themes/spinner/watermark.png"
    scripts:
      - build.sh
  - type: files
    files:
      - source: system
        destination: /
  - type: os-release
    properties:
      PRETTY_NAME: MX-OS
      VERSION_CODENAME: INFINITY
  - type: initramfs
  - type: signing
