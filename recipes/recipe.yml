---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mx-os
description: Mr? Ms? Wrong! MX is the right choice!
base-image: ghcr.io/blue-build/base-images/fedora-cosmic
image-version: latest
platforms:
  - linux/amd64
  - linux/amd64/v2
modules:
  - type: script
    scripts:
      - build.sh
  - type: files
    files:
      - source: system
        destination: /
  - type: os-release
    properties:
      PRETTY_NAME: MX-OS
  - type: initramfs
  - type: signing
